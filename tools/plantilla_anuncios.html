<style>
/*__FONTS__*/
:root{--celeste:#6caee5;--rojo:#bc1734;--dorado:#cfa55b;--gris:#808080;--link:#2f7ec2;--ink:#3b3f46;--muted:#8a8f98;--bg:#f5f5f6;--card:#fff;--line:#e4e4e7;--marino:#17233d}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
/* cabecera: marca, título grande con la última actualización y el selector de módulo; debajo, la franja tricolor y la barra de vista (misma lógica que Obras) */
header{background:#fff;padding:12px 20px 0;position:sticky;top:0;z-index:20;box-shadow:0 2px 14px #00000012}
.top{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.top img{height:38px;display:block}
.top .ttl{border-left:1px solid var(--line);padding-left:18px;min-width:0}
h1{margin:0;font-weight:900;font-size:24px;line-height:1.1;color:var(--marino);letter-spacing:.2px}
.sub{color:var(--muted);font-size:12.5px;font-weight:600;margin-top:3px} .sub b{color:var(--ink);font-weight:700}
.cinta{height:4px;margin:12px -20px 0;background:linear-gradient(90deg,var(--celeste) 0 33.34%,var(--rojo) 33.34% 66.67%,var(--dorado) 66.67%)}

nav.mods{margin-left:auto;display:inline-flex;gap:3px;background:#f3f3f4;border-radius:999px;padding:3px}
nav.mods a{padding:7px 18px;border-radius:999px;font:700 13.5px Poppins;color:var(--gris);text-decoration:none}
nav.mods a:hover{color:var(--ink)} nav.mods a.on{background:var(--marino);color:#fff}

.vista{display:flex;align-items:flex-end;gap:6px;flex-wrap:wrap;padding-top:8px;margin:0 -20px;padding-left:20px;padding-right:20px;background:#fff}
.vista .tab{border:0;background:transparent;padding:9px 18px 11px;border-radius:10px 10px 0 0;font:700 15px Poppins;color:var(--gris);position:relative;cursor:pointer;line-height:1.2;text-align:left}
.vista .tab small{display:block;font-size:11px;font-weight:600;opacity:.8;margin-top:1px}
.vista .tab.on{color:var(--marino);background:var(--bg)}
.vista .tab.on::after{content:"";position:absolute;left:18px;right:18px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--rojo)}
.vista .tab:focus-visible{outline:2px solid var(--celeste);outline-offset:-2px}
.vista .herr{margin-left:auto;align-self:center;display:flex;gap:4px;margin-bottom:6px}
.vista .chequeo,.vista .exp{border:0;background:transparent;font:600 12.5px Poppins;color:var(--muted);display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:8px;cursor:pointer}
.vista .chequeo .dot{width:9px;height:9px;border-radius:50%;background:#2e8b57;box-shadow:0 0 0 3px #2e8b5722}
.vista .chequeo.avisos .dot{background:var(--amarillo);box-shadow:0 0 0 3px #eaab3b33}
.vista .chequeo:hover,.vista .chequeo.on,.vista .exp:hover{background:#f3f3f4;color:var(--ink)}
/* campaña: pertenece a la vista (fila completa, arriba de la columna lateral y del contenido) */
.perbar{grid-column:1 / -1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-2px 0 2px}
.perbar .lbl{font-size:10.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--gris);margin-right:4px}
.perbar .res{font-size:11.5px;color:var(--muted);font-weight:600;margin-left:6px}
.pchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font:700 12.5px Poppins;color:var(--ink);cursor:pointer;display:inline-flex;align-items:baseline;gap:6px}
.pchip small{font-weight:600;color:var(--muted);font-size:11px}
.pchip:hover{border-color:#c9ccd3}
.pchip.c-cumplido.on{background:var(--celeste);border-color:var(--celeste);color:#fff} .pchip.c-en_ejecucion.on{background:var(--dorado);border-color:var(--dorado);color:#fff} .pchip.on small{color:#ffffffcc}
.wrap{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;max-width:1900px;margin:0 auto;padding:14px 16px 40px}
aside{position:sticky;top:calc(var(--hh,140px) + 12px);align-self:start;max-height:calc(100vh - var(--hh,140px) - 24px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 12px 6px;scrollbar-width:thin}

.chips{display:flex;flex-wrap:wrap;gap:4px}

.chip small{opacity:.55;font-weight:700;margin-left:4px} .chip.on{background:var(--rojo);color:#fff;border-color:var(--rojo)}
.zl{display:flex;flex-direction:column;gap:1px;max-height:300px;overflow:auto}
.zl button{display:flex;align-items:center;justify-content:space-between;border:0;background:transparent;border-radius:7px;padding:3px 8px;font:700 12px Poppins;color:var(--ink);cursor:pointer;text-align:left}
.zl button:hover{background:#f3f3f4} .zl button.on{background:var(--rojo);color:#fff} .zl button small{font-weight:700;opacity:.55}

.zl button .loc{font-size:10.5px;color:var(--muted);font-weight:600} .zl button.on .loc{color:#ffffffcc}
select,.search{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:600 12.5px Poppins;color:var(--ink);background:#fff}
.search:focus,textarea:focus,select:focus{outline:2px solid var(--celeste);outline-offset:0}
aside .res{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:6px;line-height:1.35}
aside .clr{font-size:11.5px;color:var(--link);font-weight:700;cursor:pointer;background:none;border:0;padding:0;margin-top:6px}
main{min-width:0}
/* rótulo de contexto: campaña y alcance. La campaña se marca con su color: celeste Cumplimos, dorado En marcha */
.ctx{display:flex;align-items:baseline;gap:8px 14px;flex-wrap:wrap;margin:2px 0 10px}
.ctx b{font-size:19px;font-weight:900;color:var(--celeste)} .ctx.en_ejecucion b{color:#9a7a3a} .ctx span{font-size:12.5px;font-weight:600;color:var(--gris)}
.count{font-size:12px;color:var(--muted);margin:2px 0 10px;font-weight:600} .count a{color:var(--link)}
.dep-head{margin:16px 0 6px;font-weight:900;font-size:15px;display:flex;gap:8px;align-items:baseline;color:var(--rojo)} .dep-head small{font-weight:600;color:var(--gris);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--celeste);border-radius:12px;margin-bottom:10px;overflow:hidden}
.card.en_ejecucion{border-left-color:var(--dorado)} .card.sub{margin-left:22px;border-left-width:4px}
.card>summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;gap:12px;align-items:center}
.card>summary:hover{background:#fafafa} .card>summary::-webkit-details-marker{display:none}
.card .tt{flex:1;min-width:0} .card .tt b{font-weight:700;font-size:14px;display:block;color:var(--ink)} .card .tt span{font-size:12px;color:var(--muted);font-weight:600}
.tag{font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap}
.tag.cumplido{background:#dcebf8;color:#1d4e7c} .tag.en_ejecucion{background:#f5e9cf;color:#6b4a05} .tag.aviso{background:#fde2e2;color:#8a1c1c} .tag.pit{background:#fbe9c2;color:#6b4a05} .tag.nopub{background:#eee;color:#777}
.body{padding:4px 14px 16px;border-top:1px solid var(--line)}
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;margin-top:12px}
@media(max-width:1200px){.grid{grid-template-columns:1fr}} @media(max-width:900px){.wrap{grid-template-columns:1fr}aside{position:static;max-height:none}}
.fmts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px} .fmt{text-align:center}
.fmt canvas{width:100%;height:auto;border-radius:8px;border:1px solid var(--line);background:#eee;display:block}
.fmt .lbl{font-size:11px;font-weight:700;margin:5px 0 4px;color:var(--gris)}
.btn{border:0;border-radius:8px;padding:6px 12px;font:700 12px Poppins;cursor:pointer;background:var(--rojo);color:#fff} .btn:hover{filter:brightness(1.08)}
.btn.sec{background:#efeff1;color:var(--ink)} .btn.ok{background:#4da070}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center;font-size:12px;font-weight:600}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer} .sw.on{box-shadow:0 0 0 2px var(--ink)}
/* foto de la placa: se sube desde la tarjeta, queda en este navegador, y se elige el diseño */
.foto{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:12px;font-weight:600}
.foto .mini{width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:#eee}
.foto .btn.sec{cursor:pointer} .foto input[type=file]{display:none}
.foto .dis{display:inline-flex;gap:4px} .foto .dis .chip.on{background:var(--marino);border-color:var(--marino);color:#fff}
.foto .dis .chip:disabled{opacity:.45;cursor:not-allowed}
.foto .sug{font-size:10.5px;color:var(--muted);font-weight:700;margin-left:2px}
.foto .aviso{font-size:11px;color:var(--rojo);font-weight:700}
.foto .enc{flex-basis:100%;font-size:11px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px} .foto .enc input{width:120px;margin:0}
.fmt canvas.movible{cursor:grab} .fmt canvas.movible:active{cursor:grabbing}
/* qué anuncios entran en la placa: casillas, con la placa y los copys rearmándose en vivo */
.sel{border:1px solid var(--line);border-radius:10px;padding:0;margin-bottom:12px;background:#fafafa}
.sel>summary{list-style:none;cursor:pointer;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap} .sel>summary::-webkit-details-marker{display:none}
.sel>summary b{font-size:12.5px;color:var(--ink);font-weight:800} .sel>summary b::before{content:"▸ ";color:var(--gris)} .sel[open]>summary b::before{content:"▾ "}
.sel>summary .n{font-size:11.5px;color:var(--muted);font-weight:600;flex:1}
.sel .cuerpo{padding:4px 12px 10px;border-top:1px solid var(--line)}
.sel .row{display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.sel .row .n{font-size:11px;color:var(--muted);font-weight:600}
.sel .btns{margin-top:0}
.sel ul{list-style:none;margin:0;padding:0;max-height:220px;overflow:auto}
.sel li{display:flex;gap:8px;align-items:flex-start;padding:3px 2px;font-size:12.5px;font-weight:600;line-height:1.3}
.sel li input{margin:3px 0 0;flex:none}
.sel li .loc{color:var(--muted);font-weight:600;font-size:11.5px;margin-left:4px}
.sel .hint{font-size:11px;color:var(--muted);font-weight:600;margin-top:6px}
.tx{margin-bottom:12px} .tx .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;gap:8px}
.tx label{font-weight:800;font-size:12px;color:var(--gris)} .tx .n{font-size:11px;color:var(--muted);font-weight:600} .tx .n.bad{color:var(--rojo);font-weight:800}
textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:600 12.5px/1.5 Poppins;resize:vertical;min-height:70px;color:var(--ink)}
.meta{font-size:12px;color:var(--muted);margin-top:10px;font-weight:600} .meta a{color:var(--link)}
details.doc{margin-top:8px;font-size:12px} details.doc summary{cursor:pointer;font-weight:700;color:var(--link)}
details.doc pre{white-space:pre-wrap;font:600 12px Poppins;background:#f7f7f8;border-radius:8px;padding:8px 10px}
.note{background:#fbf5e8;border:1px solid #ecd9a8;border-left:5px solid var(--dorado);border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:14px;font-weight:600}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:12px}
.list h3{margin:0 0 6px;font-size:14px;font-weight:800;color:var(--rojo)} .list ul{margin:0;padding-left:18px} .list li{margin:2px 0;font-size:12.5px;font-weight:600}
.gris{background:#f3f3f4!important;border-color:#e0e0e2!important;border-left-color:#b8bcc4!important;color:#6f747d} .gris h3{color:#6f747d!important}
.list .hint,.list h3 small{font-size:12px;color:var(--muted);font-weight:600}
footer{border-top:1px solid var(--line);background:#fff;padding:22px 16px;text-align:center} footer img{height:46px} footer p{margin:8px 0 0;font-size:11px;color:var(--muted);font-weight:600}
</style>

function exportarEdiciones(){const out={_nota:'Ediciones hechas en el tablero. Copiar a entrada/anuncios/<fecha>/contenido.json (se fusiona con lo que ya haya).',anuncios:Object.assign({},CONT.anuncios||{},ED.anuncios),localidades_piezas:Object.fromEntries(Object.entries(Object.assign({},CONT.localidades_piezas||{},ED.piezas)).map(([k,v])=>[k,Object.fromEntries(Object.entries(v).filter(([,x])=>x!=null))])),seleccion:Object.assign({},CONT.seleccion||{},ED.seleccion),localidades:CONT.localidades||{}};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:'application/json'}));a.download='contenido.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

 cumplido:{palabra:'CUMPLIMOS',nombre:'Cumplimos',emoji:'✅',tags:['#Cumplimos','#HacerParaCrecer'],

   <div class="sec"><input class="search" id="q" placeholder="Buscar localidad o texto…" value="${esc(S.q)}"><label style="display:block;font-size:11.5px;font-weight:600;margin-top:6px"><input type="checkbox" id="nopub" ${S.nopub?'checked':''}> Mostrar también los no publicables</label>${S.alcance||S.eje||S.min||S.anio||S.q?'<button class="clr" data-clr>Limpiar filtros</button>':''}
    <div class="res"><b>${nz}</b> anuncios en la selección.</div></div>`;
  $('#side').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;
    if(b.dataset.dl!==undefined){S.dep=b.dataset.dl;S.loc=b.dataset.l;S.qz='';go()}else if(b.dataset.d!==undefined){S.dep=b.dataset.d||null;S.loc=null;go()}else if(b.dataset.l!==undefined){S.loc=b.dataset.l||null;go()}
    else if(b.dataset.a){S.alcance=S.alcance===b.dataset.a?null:b.dataset.a;go()}else if(b.dataset.y){S.anio=S.anio===+b.dataset.y?null:+b.dataset.y;go()}
    else if(b.dataset.clr!==undefined){S.alcance=S.eje=S.min=S.anio=null;S.q='';go()}};
  $('#side').querySelectorAll('select').forEach(s=>s.onchange=()=>{S[s.dataset.sel]=s.value||null;go()});
  $('#nopub').onchange=ev=>{S.nopub=ev.target.checked;go()};
  $('#q').oninput=ev=>{S.q=ev.target.value;clearTimeout(S._t);S._t=setTimeout(()=>{go();const q=$('#q');q.focus();q.setSelectionRange(q.value.length,q.value.length)},300)};
  $('#qz').oninput=ev=>{S.qz=ev.target.value;clearTimeout(S._tz);S._tz=setTimeout(()=>{renderSide();const q=$('#qz');q.focus();q.setSelectionRange(q.value.length,q.value.length)},200)};
}
function ctx(){const c=CAMP[S.estado],n=alcance().length,d=S.dep?(DEP[S.dep]||{nombre_publicable:S.dep}).nombre_publicable:null;
  return `<div class="ctx ${S.estado}"><b>${c.nombre}</b><span>${d?`Departamento ${esc(d)}`:'Toda la provincia'}${S.loc?' · '+esc(nombreLoc(alcance()))+'':''} · ${n} anuncios</span></div>`}
function renderPlacas(root){
  const as=alcance(); root.innerHTML=ctx()+`<div class="count">${as.length} anuncios · ${uniq(as.map(a=>a.locKey)).length} localidades · ${uniq(as.map(a=>a.depKey)).length} departamentos</div><div id="list"></div>`;
  const list=$('#list',root); if(!as.length){list.innerHTML='<div class="list"><h3>Sin anuncios</h3><div class="hint">No hay anuncios para esta selección.</div></div>';return}
  const byDep={}; as.forEach(a=>(byDep[a.depKey]??=[]).push(a));
  Object.keys(byDep).sort((x,y)=>byDep[y].length-byDep[x].length).forEach(dk=>{
    const g=byDep[dk], d=DEP[dk]||{nombre_publicable:dk}, h=document.createElement('div'); h.className='dep-head';
    h.innerHTML=`${esc(d.nombre_publicable)} <small>${g.length} anuncios · ${uniq(g.map(a=>a.locKey)).length} localidades${d.pit==='si'?' · PIT':''}</small>`; list.appendChild(h);
    if(!S.loc&&dk!=='SIN DEPARTAMENTO'&&dk!=='CAPITAL'&&uniq(g.map(a=>a.locKey)).length>1){const mk=()=>cardPieza(piezaDepartamento(dk,g),'Departamento',false,mk);list.appendChild(mk())}
    porLoc(g).forEach(gg=>{const mk=()=>{const c=cardPieza(piezaLocalidad(gg),'Localidad',false,mk);
        const subs=c.querySelector('[data-subs]'); subs.innerHTML='<div class="count" style="margin-top:14px">Anuncio por anuncio</div>'; gg.forEach(a=>subs.appendChild(cardAnuncio(a)));return c};
      list.appendChild(mk());});
  });
}
function renderCalidad(root){
  const T=[]; ['cumplido','en_ejecucion'].forEach(e=>{const as=PUB.filter(a=>a.estado===e); porLoc(as).forEach(g=>{const p=piezaLocalidad(g);T.push([p.id+' · Instagram',p.ig],[p.id+' · X',p.x],[p.id+' · SMS',p.sms],[p.id+' · placa',textoPlaca(p.placa)])});
    as.forEach(a=>{const p=piezaAnuncio(a);T.push([p.id+' · Instagram',p.ig],[p.id+' · X',p.x],[p.id+' · SMS',p.sms],[p.id+' · placa',textoPlaca(p.placa)])});
    uniq(as.map(a=>a.depKey)).forEach(dk=>{const p=piezaDepartamento(dk,as.filter(a=>a.depKey===dk));T.push([p.id+' · Instagram',p.ig],[p.id+' · X',p.x],[p.id+' · SMS',p.sms])})});
  const test=re=>T.filter(([,t])=>re.test(t)).map(([n])=>n), SMS=T.filter(([n])=>/ · SMS$/.test(n));
  const reglas=[['No menciona “seccional” ni circuitos electorales',test(/seccional|subcircuito|circuito electoral/i)],['No menciona montos ni signos de pesos',test(/\$|millones de pesos|\bmillones\b|presupuesto|monto/i)],['No usa barras “/” (salvo en links)',T.filter(([,t])=>/\//.test(t.replace(/https?:\/\/\S+/g,''))).map(([n])=>n)],
    [`SMS de un solo mensaje (hasta ${SMS_MAX} caracteres con link corto)`,SMS.filter(([,t])=>smsLen(t)>SMS_MAX).map(([n])=>n)],['SMS: qué se hizo antes del link y el link al final',SMS.filter(([,t])=>!/\S.*\. Más info: \[link\]$/.test(t)).map(([n])=>n)],
    ['Textos de X dentro de 280 caracteres',T.filter(([n,t])=>/ · X$/.test(n)&&t.length>280).map(([n])=>n)],['Los textos en marcha no dicen “cumplido”',T.filter(([n,t])=>/^(l|d)_en_ejecucion|^a_/.test(n)&&/\bcumplid[oa]s?\b|\bcumplimos\b/i.test(t)&&(n.startsWith('a_')?PUB.some(a=>'a_'+a.id===n.split(' ')[0]&&a.estado==='en_ejecucion'):true)).map(([n])=>n)],
    ['SMS genéricos (el texto no entra en un mensaje: dicen solo el tipo de cumplimiento)',SMS.filter(([n,t])=>/^a_/.test(n)&&/^(?:[^:]+: )?(?:Fondos entregados|Obra finalizada|Cumplido|En ejecución|Obra en ejecución|En licitación|Convenio firmado|En proyecto|Obra adjudicada|Fondos en entrega) en /.test(t)).map(([n])=>n)]];
  const rev=PUB.filter(a=>(a.avisos||[]).some(x=>/monto|gobernador|verbo|largo|vacío/.test(x))), sinLoc=A.filter(a=>a.alcance==='local'&&!a.localidad), fuera=A.filter(a=>(a.avisos||[]).some(x=>/fuera de la maestra/.test(x))), sinDic=A.filter(a=>(a.avisos||[]).some(x=>/sin diccionario/.test(x))), noPub=A.filter(a=>!a.publicable&&a.estado!=='pendiente');
  const L=(t,a,hint)=>`<div class="list"><h3>${t} <small>(${a.length})</small></h3>${hint?`<div class="hint">${hint}</div>`:''}<ul>${a.slice(0,60).map(x=>`<li>${x}</li>`).join('')||'<li>Nada pendiente</li>'}${a.length>60?`<li>… y ${a.length-60} más</li>`:''}</ul></div>`;
  const nm=a=>`${esc(a.localidad?tituloLoc(a.localidad):a.localidad_base)} · meta ${a.id}: ${esc(textoDe(a).slice(0,90))}`;
  root.innerHTML=`<div class="note gris">Chequeo automático de los textos publicables y de los datos de la base. Nada se rellena: lo que falta queda afuera y se avisa.</div>
   <div class="list gris"><h3>Reglas de redacción</h3><ul>${reglas.map(([n,bad])=>`<li>${bad.length?'✖':'✔'} ${n}${bad.length?` — <b>${bad.length}</b> casos: ${esc(bad.slice(0,4).join(', '))}${bad.length>4?'…':''}`:''}</li>`).join('')}</ul><div class="hint">${T.length} textos revisados.</div></div>
   ${L('Textos de placa para revisar a mano',rev.map(a=>nm(a)+' <small>('+esc(a.avisos.filter(x=>/monto|gobernador|verbo|largo|vacío/.test(x)).join('; '))+')</small>'),'La limpieza automática no alcanzó: editar el texto de la placa en la tarjeta o cargar la corrección en contenido.json → anuncios → {meta: {placa}}.')}
   ${L('Anuncios locales sin localidad',sinLoc.map(nm))}
   ${L('Localidades fuera de la maestra',fuera.map(nm),'Agregar a Localidades_maestra.xlsx o definir cómo se tratan las comunidades regionales.')}
   ${L('Estados desagregados sin diccionario',sinDic.map(nm),'Agregar la fila a data/dic_estado_anuncio.csv.')}
   ${L('Anuncios no publicables (en trámite, espera de documentación, suspendidos)',noPub.map(nm),'Se excluyen de las placas salvo que se marque “Mostrar también los no publicables”.')}
   ${Object.keys(TX).length?L('Redacción con IA: dudas sobre si publicar',A.filter(a=>(TX[a.id]||{}).duda).map(a=>nm(a)+' <small>('+esc(TX[a.id].duda)+')</small>'),`${Object.values(TX).filter(t=>!t.revisado).length} textos de IA todavía sin revisar. Marcar revisado=true en data/anuncios_textos.json cuando estén vistos.`):'<div class="list"><h3>Redacción con IA</h3><div class="hint">Todavía no se corrió tools/redactar_anuncios.py: los textos de placa son la limpieza automática del parser.</div></div>'}
   ${L('Avisos de la base',D.avisos.map(esc))}`;
}
function renderFicha(root){
  const a=A.find(x=>x.id===S.ficha); if(!a){S.tab='placas';return renderPlacas(root)}
  const p=piezaAnuncio(a), e=edAnuncio(a.id), c=CAMP[a.estado]||CAMP.cumplido, L=a.localidad?tituloLoc(a.localidad):'Toda la provincia';
  root.innerHTML=`<div class="ctx ${a.estado}"><button class="btn sec" data-volver>← Volver al listado</button><b>${esc(L)}</b><span>${esc(a.etiqueta)}${a.anioTxt?' · anunciado en '+esc(a.anioTxt):''} · meta ${a.id}${a.pit?' · PIT':''}</span></div>
   <div class="list"><h3>Datos de la base</h3><ul>
    <li><b>Texto original:</b> ${esc(a.texto_original)}</li>${a.detalle?`<li><b>Detalle del anuncio:</b> ${esc(a.detalle)}</li>`:''}
    <li><b>Estado:</b> ${esc(a.estado)} · ${esc(a.etiqueta)} ${a.publicable?'':'· <b>no publicable</b>'}</li>
    <li><b>Alcance:</b> ${esc(a.alcance)} · <b>Departamento:</b> ${esc(a.departamento||'—')} · <b>Localidad:</b> ${esc(a.localidad||a.localidad_base||'—')}</li>
    <li><b>Eje:</b> ${esc(a.eje||'—')} · <b>Ministerio:</b> ${esc(a.ministerio||'—')} · <b>Fecha del anuncio:</b> ${esc(a.fecha_anuncio||'—')}${a.tipo_discurso?' · '+esc(a.tipo_discurso):''}</li>
    <li><b>Fuentes:</b> ${a.fuente_anuncio?`<a href="${esc(a.fuente_anuncio)}" target="_blank" rel="noopener">anuncio</a>`:'sin fuente'}${a.fuente_seguimiento?` · <a href="${esc(a.fuente_seguimiento)}" target="_blank" rel="noopener">seguimiento</a>`:''}</li>
    ${a.avisos.length?`<li><b>Avisos del parser:</b> ${esc(a.avisos.join('; '))}</li>`:''}
    ${e.placa&&TX[a.id]?`<li><b>Redacción con IA:</b> ${esc(TX[a.id].placa)}${TX[a.id].duda?` · <b>duda:</b> ${esc(TX[a.id].duda)}`:''}</li>`:''}</ul></div>
   <details class="card ${a.estado}" open><summary><div class="tt"><b>${esc(textoDe(a))}</b><span>Placa, copys, SMS y gacetilla · todo lo que edites queda guardado en este navegador</span></div><span class="tag ${a.estado}">${esc(c.nombre)}</span></summary>
    <div class="body"><div class="grid"><div>${placaHTML(p.placa,p.id)}</div><div>${txHTML(p.ig,p.x,textoPlaca(p.placa),p.sms,null,p.gac)}</div></div></div></details>`;
  wire(root.querySelector('details.card'),p.id,p.placa);
  root.querySelector('[data-volver]').onclick=()=>{S.tab='placas';S.ficha=null;go()};
}
const fechaLarga=s=>{const d=new Date(s+'T00:00:00');if(isNaN(d))return s;const M=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'],W=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];return `${W[d.getDay()]} ${d.getDate()} de ${M[d.getMonth()]} de ${d.getFullYear()}`};
function renderHeader(){
  const lk='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(SVG['gobierno-color']);$('#lockup').src=lk;$('#lockup2').src=lk;
  $('#sub').innerHTML=`Última actualización: <b>base de anuncios del ${esc(fechaLarga(D.fecha))}</b> · ${D.total} anuncios`;
  // barra de vista: primero qué ver (placas y copys; la ficha, cuando hay una abierta); Chequeo y Exportar, discretos a la derecha
  const tabs=[['placas','Placas y copys por localidad','por departamento y localidad, con cada anuncio'],...(S.ficha?[['ficha','Ficha del anuncio','placas y copys de un anuncio']]:[])];
  const nEd=Object.keys(ED.anuncios).length+Object.keys(ED.piezas).length, cal=S._cal;
  $('#tabs').innerHTML=tabs.map(([k,l,s])=>`<button role="tab" data-k="${k}" class="tab ${S.tab===k?'on':''}" aria-selected="${S.tab===k}">${l}<small>${s}</small></button>`).join('')+
   `<div class="herr"><button data-k="calidad" class="chequeo ${S.tab==='calidad'?'on':''} ${cal&&cal.n?'avisos':''}" title="Chequeo de calidad"><span class="dot"></span>Chequeo de calidad${cal?(cal.n?` · ${cal.n} ${cal.n===1?'regla con casos':'reglas con casos'}`:' · todo ✔'):''}</button><button data-exp class="exp" title="Baja un contenido.json con todo lo editado en este navegador">Exportar ediciones${nEd?' ('+nEd+')':''}</button></div>`;
  $('#tabs').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.exp!==undefined)exportarEdiciones();else{S.tab=b.dataset.k;go()}};
  // campaña: pertenece a la vista
  const per=$('#per'), base=(S.nopub?A:PUB);
  if(S.tab==='calidad'){per.innerHTML='';per.hidden=true}
  else{per.hidden=false;per.innerHTML=`<span class="lbl">Campaña</span>`+[['cumplido','Cumplimos'],['en_ejecucion','En marcha']].map(([k,l])=>`<button class="pchip c-${k} ${S.estado===k?'on':''}" data-e="${k}">${l}<small>${base.filter(a=>a.estado===k).length}</small></button>`).join('')+
    `<span class="res">${S.estado==='cumplido'?'Anuncios con estado cumplido: fondos entregados, obras finalizadas y compromisos cumplidos.':'Anuncios en ejecución: obras en marcha, licitaciones, convenios firmados y proyectos.'}</span>`;
    per.onclick=ev=>{const b=ev.target.closest('button[data-e]');if(b){S.estado=b.dataset.e;go()}}}
  document.documentElement.style.setProperty('--hh',$('header').offsetHeight+'px');
}
function go(){renderHeader();renderSide();({placas:renderPlacas,calidad:renderCalidad,ficha:renderFicha})[S.tab]($('#main'));
  if(!S._cal){S._cal={n:null};setTimeout(()=>{try{const d=document.createElement('div');renderCalidad(d);const li=[...d.querySelectorAll('.list.gris li')];S._cal={n:li.filter(x=>x.textContent.trim().startsWith('✖')).length}}catch(e){S._cal={n:null}}renderHeader()},0)}}
window.addEventListener('resize',()=>document.documentElement.style.setProperty('--hh',$('header').offsetHeight+'px'));
$('#main').addEventListener('click',ev=>{const b=ev.target.closest('[data-ficha]');if(b){S.ficha=+b.dataset.ficha;S.tab='ficha';go();window.scrollTo(0,0)}});
go();
})();
